services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - bot-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bot", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  bot-data:
